site_name: MkDocs with Google Authentication
site_description: A MkDocs site with Google Authentication
site_author: Your Name

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
  palette:
    primary: indigo
    accent: indigo

plugins:
  - search
  - macros
  - mkdocs-simple-hooks:
      hooks:
        on_page_markdown: "mkdocs_msal_auth.hooks:on_page_markdown"
        on_pre_build: "mkdocs_msal_auth.hooks:on_pre_build"
        on_pre_template: "mkdocs_msal_auth.hooks:on_pre_template"

extra:
  generator: false
  auth:
    enabled: true
    allowed_domains:
      - gmail.com
      # Add more domains as needed
    allowed_emails:
      # Add specific emails here