site_name: MkDocs with Entra ID Authentication
site_description: MkDocs static docs served by Flask with Entra ID access control
site_author: Your Name

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
  palette:
    primary: indigo
    accent: indigo

plugins:
  - search
  - macros
  - mkdocs-simple-hooks:
      hooks:
        on_page_markdown: "src.mkdocs_msal_auth.hooks:on_page_markdown"
        on_pre_build: "src.mkdocs_msal_auth.hooks:on_pre_build"
        on_template_context: "src.mkdocs_msal_auth.hooks:on_template_context"

extra:
  generator: false
