[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mkdocs-msal-auth"
version = "0.1.0"
description = "MkDocs static docs hosted by Flask with Microsoft Entra ID authentication."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "flask",
  "gunicorn",
  "msal",
  "python-dotenv",
  "pyyaml",
  "requests",
  # Docs builder. Pinned to the MkDocs line the existing docs were written
  # against. Kept in runtime deps because the Docker image builds site/ at
  # image build time.
  "mkdocs==1.6.1",
  "mkdocs-material",
  "mkdocs-macros-plugin",
  "mkdocs-simple-hooks",
]

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]

[tool.uv]
# Application, not an installable library: `uv sync` installs dependencies
# only. The code runs from the repo root (`python -m app.webapp.server`).
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["D", "E", "F", "I", "W"]
ignore = ["D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"
